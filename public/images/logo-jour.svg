<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="100%" height="100%">
  <defs>
    <!-- Dégradé principal Violet -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#6A1BFA" />
      <stop offset="100%" stop-color="#4312B8" />
    </linearGradient>

    <!-- Dégradé vague Turquoise -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19E6C1" />
      <stop offset="100%" stop-color="#08999E" />
    </linearGradient>

    <!-- Dégradé texte Digiplex -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6A1BFA" />
      <stop offset="100%" stop-color="#07C8B5" />
    </linearGradient>

    <!-- Découpe de la forme du D avec encoches pixels -->
    <clipPath id="dClip">
      <path d="M 52 20 H 92 A 60 60 0 0 1 152 80 A 60 60 0 0 1 92 140 H 50 A 14 14 0 0 1 36 126 V 68 H 48 V 52 H 36 V 36 H 52 Z" />
    </clipPath>
  </defs>

  <!-- Pixels détachés (haut gauche) -->
  <rect x="20" y="20" width="9" height="9" rx="1.5" fill="#4A14C4" />
  <rect x="12" y="42" width="10" height="10" rx="1.5" fill="#5817DC" />
  <rect x="28" y="34" width="12" height="12" rx="2" fill="#5E19E6" />
  <rect x="28" y="54" width="12" height="12" rx="2" fill="#631BEF" />

  <!-- Corps du D avec vague bicolore -->
  <g clip-path="url(#dClip)">
    <rect x="30" y="15" width="130" height="130" fill="url(#purpleGrad)" />
    <path d="M 30 115 Q 95 110 125 65 L 160 65 L 160 145 L 30 145 Z" fill="url(#tealGrad)" />
  </g>

  <!-- Flèche centrale blanche -->
  <path d="M 68 50 H 90 A 8 8 0 0 1 98 58 V 84 H 112 A 3 3 0 0 1 114 89 L 83 120 A 3 3 0 0 1 78 120 L 47 89 A 3 3 0 0 1 49 84 H 63 V 55 A 5 5 0 0 1 68 50 Z" fill="#FFFFFF" />

  <!-- Typographie -->
  <text x="180" y="96" font-family="&#39;Plus Jakarta Sans&#39;, &#39;Inter&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="68" font-weight="800" fill="#0F0B2E" letter-spacing="-1.5">Dowlify</text>
  <text x="182" y="132" font-family="&#39;Plus Jakarta Sans&#39;, &#39;Inter&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="26" font-weight="500" fill="#5A607F">
    by <tspan font-weight="700" fill="url(#textGrad)">Digiplex</tspan>
  </text>
</svg>